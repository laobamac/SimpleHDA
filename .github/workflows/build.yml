name: Build and Publish
on:
  push:
    branches: ['**']
  pull_request:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: simplehda-${{ github.event_name == 'push' && 'pre' || github.event_name == 'release' && github.event.release.tag_name || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
jobs:
  build:
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: macos-15-intel
    timeout-minutes: 30
    outputs:
      channel: ${{ steps.channel.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Choose channel
        id: channel
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == release ]]; then
            echo 'value=rel' >> "$GITHUB_OUTPUT"
          else
            echo 'value=pre' >> "$GITHUB_OUTPUT"
          fi
      - name: Check formal version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          version = plistlib.loads(Path('Info.plist').read_bytes())['CFBundleVersion']
          if os.environ['RELEASE_TAG'] not in (version, f'v{version}'):
              raise SystemExit('Release tag must match Info.plist')
          PY
      - name: Build and verify
        run: zsh Tools/build.zsh
      - name: Package
        env:
          CHANNEL: ${{ steps.channel.outputs.value }}
        run: python3 Tools/package.py --channel "$CHANNEL"
      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SimpleHDA
          path: |
            Dist/*.zip
            Dist/*.sha256
          if-no-files-found: error
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-logs
          path: Build/xcode-*.log
          if-no-files-found: ignore
  publish:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: SimpleHDA
          path: Dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: python3 Tools/publish.py --channel "$CHANNEL"
